# =============================================================================
# the 3D-intermediate spike feature - TripoSG on rootless Podman + CDI
# =============================================================================
# The spike's only GPU batch job. Like ../gpu/compose.yml it runs on rootless
# Podman and gets the GPU through CDI (`devices: nvidia.com/gpu=all`). Everything
# else in the spike (mixamotoopenpose, render_openpose.py, the post-chain, the
# comparison page) runs on Docker Desktop, on CPU. Never the native Docker daemon.
#
# Use the wrapper, from anywhere:
#   tools/anim-pipeline/spike3d/triposg.sh build            # build the image (no GPU needed)
#   tools/anim-pipeline/spike3d/triposg.sh \
#     --image-input /work/in/knight_apose.png --output-path /work/out/knight.glb
#   tools/anim-pipeline/spike3d/triposg.sh --dry-run --image-input /work/in/knight_apose.png
#
# It is `podman-compose -f compose.yml run --rm triposg ...` underneath.
#
# VRAM: TripoSG needs ~8 GB (upstream's floor) and ComfyUI's identity pass
# ~14-20 GB. The two no longer need to be sequenced by hand: the run books its
# memory from the shared GPU gatekeeper (~/Repos/gpu-gatekeeper, job profile
# `anim-triposg`) before the model loads. If the card is full it waits in the
# gatekeeper's queue, and the gatekeeper frees an idle ComfyUI to make room.
# It is still a batch job (`run --rm`), not a daemon.
# =============================================================================

# Explicit project name: a bare `compose -f ...` would otherwise name the project
# after this directory and call it `spike3d`.
name: anim-pipeline-spike3d

services:
  triposg:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/spike3d-triposg:local
    container_name: spike3d-triposg

    # tini as PID 1 so a stop reaches python instead of orphaning it.
    init: true

    # The GPU, through CDI (rootless Podman). TripoSG hard-codes device="cuda",
    # so without it the run stops with a clear message instead of degrading.
    devices:
      - "nvidia.com/gpu=all"
    # Fedora SELinux: label=disable lets the container open the NVIDIA device
    # nodes and the bind mounts below (same as ../gpu/compose.yml).
    security_opt:
      - "label=disable"

    volumes:
      # The spike's own scratch: in/ (reference sprites), out/ (GLB + OBJ),
      # poses/, work/. Bind-mounting the spike directory keeps run_triposg.py
      # editable without a rebuild (run it as /work/run_triposg.py).
      - .:/work
      # Model weights, on the big disk next to the ComfyUI ones. ~8 GB.
      # Created by triposg.sh; NOT inside the repo (see .gitignore).
      - "/mnt/private/AI Data/models/3D Models:/weights"

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # Weights and the HF blob cache land on /mnt/private, not in the image and
      # not in the repo.
      - HF_HOME=/weights/.hf
      - TRIPOSG_WEIGHTS=/weights/TripoSG
      # Ampere (sm_86). Recorded here as well as in the Dockerfile so a rebuild
      # with a different base cannot quietly lose it.
      - TORCH_CUDA_ARCH_LIST=8.6
      # The shared GPU gatekeeper. Rootless Podman can't reach the host's LAN IP,
      # so it goes through host.containers.internal.
      - GPU_GATEKEEPER_URL=${GPU_GATEKEEPER_URL:-http://host.containers.internal:7886}

    # A batch job, not a service: always `run --rm`, never `up`.
    restart: "no"
