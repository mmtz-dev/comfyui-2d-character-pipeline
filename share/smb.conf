# ---------------------------------------------------------------------------
# anim-pipeline asset share  —  the Mac edit share feature
#
# Mounted read-only into dockurr/samba at /etc/samba/smb.conf. When that file
# is non-empty the image's entrypoint uses it verbatim instead of generating
# one, then adds the SMB_USER account (uid/gid from compose.yml) to it.
#
# Keep `valid users = @smb` and the group name `smb`: the entrypoint always
# puts the account in that group, so nothing here has to know the username.
# ---------------------------------------------------------------------------

[global]
   workgroup = WORKGROUP
   server string = anim-pipeline asset share
   server role = standalone server

   # Password required. No guest fallback, no anonymous listing.
   security = user
   map to guest = Never
   restrict anonymous = 2

   # SMB2/3 only. macOS 11+ needs nothing older and SMB1 stays off.
   server min protocol = SMB2_10
   server max protocol = SMB3
   client min protocol = SMB2_10

   # No printers, no NetBIOS daemon in this container. Discovery can't
   # advertise a non-445 port anyway, so the Mac connects by explicit URL.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   disable netbios = yes
   smb ports = 445

   logging = stdout
   log level = 1
   max log size = 0

   # -- macOS friendliness -------------------------------------------------
   # `fruit` speaks the Apple SMB extensions (AAPL), which is what makes Finder
   # behave like it is talking to a Mac server instead of guessing.
   vfs objects = fruit
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:veto_appledouble = no
   fruit:posix_rename = yes
   fruit:zero_file_id = yes
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   ea support = yes

   # -- Why `streams_xattr` is NOT in `vfs objects` -------------------------
   # The usual macOS recipe is `vfs objects = fruit streams_xattr`, and that is
   # what this file started as. Measured on this host 2026-09-13:
   #
   #   Docker Desktop bind-mounts the host directory through a `fakeowner`
   #   filesystem that returns "Not supported" for every extended-attribute
   #   call. With streams_xattr loaded, Samba's rename path goes through that
   #   module, hits EOPNOTSUPP, and EVERY rename on the share fails with
   #   NT_STATUS_NOT_SUPPORTED - including renaming a file to a brand-new name.
   #   Dropping streams_xattr made rename, mkdir, rmdir, delete and
   #   overwrite-in-place all pass. (A control share pointed at a normal
   #   in-container filesystem behaved identically, confirming the mount - not
   #   Samba or the image - is the constraint.)
   #
   # So the trade is deliberate: we give up storing Mac metadata (Finder tags,
   # colour labels, resource forks - none of which this mount could store
   # anyway) and we keep a share where files can be renamed. `fruit:metadata =
   # stream` is left set because it is the right value the moment this share
   # moves to a filesystem with real xattrs (see README: the host smbd route).
   #
   # If Finder ever errors on a save, do NOT re-add streams_xattr - that is the
   # thing that breaks writes here.

   # Ordinary local disk holding a git working tree — no need to pay for
   # synchronous writes on every block.
   strict sync = no
   sync always = no

   # Let Samba own the permission story; don't let the client negotiate POSIX
   # semantics it can't honour through fakeowner.
   unix extensions = no

# ---------------------------------------------------------------------------
# The share Pixelorama edits. Path is game-02-tactical-rpg/assets on the host.
# ---------------------------------------------------------------------------
[game02-assets]
   comment = game-02 runtime assets - edit PNGs in place
   path = /shares/game02-assets
   valid users = @smb
   read only = no
   writable = yes
   browseable = yes
   guest ok = no
   create mask = 0644
   directory mask = 0755
   force group = smb

   # Finder droppings never reach the repo. `delete veto files` lets Finder
   # remove a directory even when only vetoed files remain inside it.
   veto files = /._*/.DS_Store/.AppleDouble/.AppleDB/.AppleDesktop/.TemporaryItems/.Trashes/.fseventsd/.Spotlight-V100/.VolumeIcon.icns/Network Trash Folder/Temporary Items/
   delete veto files = yes

# ---------------------------------------------------------------------------
# Source art, the palette (palette.gpl / palette.png) and the extraction
# scripts. Read-write so a palette tweak can be made from the Mac too.
# ---------------------------------------------------------------------------
[game02-assets-src]
   comment = game-02 source art and palette
   path = /shares/game02-assets-src
   valid users = @smb
   read only = no
   writable = yes
   browseable = yes
   guest ok = no
   create mask = 0644
   directory mask = 0755
   force group = smb
   veto files = /._*/.DS_Store/.AppleDouble/.AppleDB/.AppleDesktop/.TemporaryItems/.Trashes/.fseventsd/.Spotlight-V100/.VolumeIcon.icns/Network Trash Folder/Temporary Items/
   delete veto files = yes
