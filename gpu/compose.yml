# =============================================================================
# the GPU image service feature - ComfyUI headless under ROOTLESS PODMAN
# =============================================================================
# THIS IS THE ONLY PODMAN SERVICE IN THIS PROJECT. Everything else (the CPU
# pipeline, the model downloader, the Samba share) runs on Docker Desktop
# (context `desktop-linux`), and the two engines do not know about each other.
#
# Start it - no sudo, no daemon to start first:
#
#     podman-compose -f tools/anim-pipeline/gpu/compose.yml up -d
#     podman-compose -f tools/anim-pipeline/gpu/compose.yml down
#
# It used to run on the native `docker.service`, which was the only engine on
# this host with the nvidia runtime - and which is off-limits because it breaks
# the owner's setup, so every render needed `sudo systemctl start docker` from a
# real TTY first. Rootless Podman reaches the same GPU through CDI instead, with
# no daemon and no sudo, so that whole step is gone (2026-09-25; see DEVLOG).
#
# Validate the file without running it:
#     podman-compose -f tools/anim-pipeline/gpu/compose.yml config
# =============================================================================

# Explicit project name: a bare `-f ...` would otherwise derive the project
# from this directory and call it `gpu`.
name: anim-pipeline-gpu

services:
  comfyui:
    # Pinned by digest for reproducibility (recorded alongside the model
    # SHA256s in models.lock). Resolved 2026-09-13 from Docker Hub:
    #   mmartial/comfyui-nvidia-docker:latest
    # MIT licence, non-root (runs as `comfy` remapped to WANTED_UID/GID).
    # To move the pin: look the tag up again on Docker Hub and replace BOTH
    # the tag and the digest, then note the change in DEVLOG.md.
    # Podman needs the registry spelled out; Docker's bare-name default was
    # docker.io, Podman refuses to guess.
    image: docker.io/mmartial/comfyui-nvidia-docker:latest@sha256:7a54a28001b65a5b13f8bf46a90a565bb7bb07759ec5b4d033308a5f27908a95
    container_name: anim-pipeline-comfyui

    # tini as PID 1 so a stop reaches ComfyUI instead of orphaning it.
    init: true

    # THE GPU. Not `runtime: nvidia` - that is a daemon-level runtime the
    # native Docker daemon declares in /etc/docker/daemon.json, and rootless
    # Podman has no daemon to declare it in. CDI instead: nvidia-ctk writes a
    # spec describing the device nodes and libraries to inject, Podman reads it
    # by name. The spec lives at /var/run/cdi/nvidia.yaml and is kept current
    # by nvidia-cdi-refresh.service (enabled), which regenerates it after a
    # driver update - so this needs no maintenance.
    #   Check the device exists:  ls /var/run/cdi/nvidia.yaml
    #   Prove the GPU is visible: podman run --rm --device nvidia.com/gpu=all \
    #       --security-opt label=disable docker.io/nvidia/cuda:13.0.3-runtime-ubuntu24.04 nvidia-smi
    devices:
      - "nvidia.com/gpu=all"

    # Fedora SELinux is Enforcing. `label=disable` opts this container out of
    # SELinux confinement, which is what lets it open the injected NVIDIA
    # device nodes AND read the bind mounts below without relabelling them.
    # Deliberately NOT `:z` / `:Z` on the volumes: those relabel the host
    # directory, and "/mnt/virt-containers/ai-models/image" is a shared
    # library other services read - relabelling it would be a side effect on
    # their data. This is the same trade clone-studio's compose.gpu.yml makes.
    security_opt:
      - "label=disable"

    # Rootless Podman maps container UID 1000 to host UID 525287 (the owner's
    # subuid range, /etc/subuid: 524288+999), so without this every file
    # ComfyUI writes into the basedir would land owned by a phantom user and
    # need a chown before the owner could touch it from the Mac share.
    # `keep-id` pins host UID 1000 to container UID 1000, which is what
    # WANTED_UID/WANTED_GID below already assume.
    # The key is `userns_mode`, NOT `userns`: podman-compose reads the first
    # (podman_compose.py, "--userns") and silently ignores the second, so the
    # wrong spelling looks fine in `config` output and still writes every file
    # as the phantom uid.
    userns_mode: keep-id

    # LAN-visible on purpose, like every other service on this host: the CPU
    # pipeline container runs on the Docker Desktop VM and reaches this service
    # at host.docker.internal:8188, which resolves to this host's gateway. A
    # 127.0.0.1 bind would be invisible from that VM, and from the owner's Mac.
    ports:
      - "0.0.0.0:8188:8188"

    volumes:
      # ComfyUI's own code + the python venv. Kept off the container layer so a
      # recreate does not reinstall torch. Created by the owner before first up.
      - "/mnt/private/AI Data/comfyui-run:/comfy/mnt"
      # BASE_DIRECTORY: models, custom_nodes, input, output, user.
      # Pre-populated by gpu/download_models.sh (models) and by the pinned
      # clones listed in gpu/custom_nodes.txt (custom_nodes).
      - "/mnt/private/AI Data/comfyui-basedir:/basedir"
      # The shared image-model library (on the NVMe since 2026-10-11), read-only, so nothing is
      # duplicated. Wired in by extra_model_paths.yaml below.
      - "/mnt/virt-containers/ai-models/image:/shared-models:ro"
      # Repo-owned config, mounted read-only so the repo stays the source of truth.
      - "./extra_model_paths.yaml:/extra_model_paths.yaml:ro"
      # Repo-owned start-up scripts, run by the init in name order inside the
      # activated venv on every start (idempotent). 10-nunchaku.sh installs the
      # pinned `nunchaku` wheel the ComfyUI-nunchaku node pack needs.
      - "./userscripts:/userscripts_dir:ro"

    environment:
      # `uv` instead of pip: much faster container start, recommended upstream.
      - USE_UV=true
      # Host user, so every file ComfyUI writes into the basedir is owned by
      # the owner and editable from the Mac share without a chown dance.
      # From `id -u` / `id -g` on this host (both 1000). Only true because of
      # `userns: keep-id` above - see the note there.
      - WANTED_UID=1000
      - WANTED_GID=1000
      - BASE_DIRECTORY=/basedir
      - SECURITY_LEVEL=normal
      # Custom nodes are pre-cloned at pinned commits (gpu/custom_nodes.txt),
      # so the Manager never needs to fetch code or pip-install at runtime.
      - ALLOW_GIT_URL_INSTALL=false
      - ALLOW_PIP_INSTALL=false
      - USE_NEW_MANAGER=true
      # Pin torch. The image otherwise installs the newest torch on every start
      # (2.13.0 on 2026-09-15), and the `nunchaku` wheel is built per torch minor
      # version - none exists for 2.13. 2.11.0 is the newest with a v1.2.1 wheel,
      # which is the same version as the pinned node pack. Move this and
      # userscripts/10-nunchaku.sh together, never one without the other.
      - TORCH_LOCK=torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0
      # Belt and braces beside the CDI device: the toolkit reads these when it
      # injects, and some node packs check them to decide they have a GPU.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # --extra-model-paths-config  : pick up the shared read-only checkpoints.
      # --reserve-vram 3            : the fixed cap (gpu-gatekeeper Feature 6).
      #                               ComfyUI keeps 3 GB of the 24 GB card free and
      #                               offloads rather than grow past ~21 GB. The
      #                               heaviest measured stage (Qwen-Edit) peaks at
      #                               20.5 GiB, so it still fits; the 3 GB covers
      #                               other processes' CUDA contexts and a small
      #                               job booked through the gatekeeper. Was 1
      #                               (display compositor), which 3 still covers.
      #                               Applies on recreate: up -d --force-recreate.
      # --disable-auto-launch       : headless, never try to open a browser.
      # The init script appends its own --basedir to this variable.
      - COMFY_CMDLINE_EXTRA=--extra-model-paths-config /extra_model_paths.yaml --reserve-vram 3 --disable-auto-launch
      # Ampere (A5000, sm_86) has NO fp8 tensor cores. Do NOT add
      # `--fast fp8_matrix_mult` here: it is a no-op at best on this card.
      # The speed path is the INT8/INT4 weights in models.lock.

    # Manual only. This service exists to serve batches of frames; it should not
    # come back up on boot and sit on 20 GB of VRAM.
    restart: "no"
