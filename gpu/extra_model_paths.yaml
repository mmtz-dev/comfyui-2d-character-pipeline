# =============================================================================
# ComfyUI extra_model_paths.yaml - the GPU image service feature
# =============================================================================
# Mounted read-only into the container at /extra_model_paths.yaml by
# gpu/compose.yml, and passed to ComfyUI with
#   --extra-model-paths-config /extra_model_paths.yaml
#
# Purpose: expose the shared image-model library on this host at
#   /mnt/private/AI Data/models/Image Models/
# (mounted read-only at /shared-models). Since 2026-10-02 this pipeline's own
# locked weights live there too (gpu/download_models.sh installs them there), so
# every image model on the machine is in one folder with a usage note beside it.
# The basedir's models/ is now empty; ComfyUI still scans it through
# BASE_DIRECTORY, which is harmless.
#
# COLLISION RULE: ComfyUI merges every path configured for a folder type into
# one flat list keyed by FILENAME. Two files with the same basename in two
# different roots are ambiguous and the loser is picked non-deterministically.
# That is why models.lock stores Z-Image's `ae.safetensors` as
# `z_image_ae.safetensors`: /shared-models/vae/ already holds a Flux
# `ae.safetensors`. Keep that rule in mind before adding anything below.
#
# Read-only is enforced by the `:ro` bind in compose.yml, not by this file.
# =============================================================================

shared_image_models:
  base_path: /shared-models

  # Existing SDXL / SD1.5 / SD2.1 / Flux / Chroma / Pony checkpoints.
  checkpoints: checkpoints

  # The pipeline's locked weights (models.lock dest_subdir values).
  diffusion_models: diffusion_models
  text_encoders: text_encoders
  model_patches: model_patches

  # Note the singular directory names on disk - they are the host's spelling,
  # not ComfyUI's. The KEY is what ComfyUI calls the folder type; the VALUE is
  # the real subdirectory under base_path.
  #
  # lora/ is listed recursively, so a file in lora/_Z_Image/ would be named
  # "_Z_Image/<file>". The two base folders are ALSO listed as roots so the
  # workflows' bare filenames (pixel_art_style_z_image_turbo.safetensors) resolve.
  loras: |
    lora
    lora/_Z_Image
    lora/_Qwen_Image
  upscale_models: upscalers
  embeddings: embeddings

  # Currently empty on disk, listed so a future ControlNet dropped in there is
  # picked up without editing this file.
  controlnet: controlnet

  # Holds a Flux `ae.safetensors` plus two misfiled text encoders
  # (clip_l.safetensors, t5xxl_fp16.safetensors). Harmless: this pipeline
  # references its VAEs by the distinct names in models.lock.
  vae: vae
